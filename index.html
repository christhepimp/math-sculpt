<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MathClay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #07070a;
      color: #e8e8ec;
      overflow: hidden;
      height: 100vh;
      touch-action: none;
    }
    #canvas-container { position: absolute; inset: 0; }

    /* Side toggle for math terminal */
    #term-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      width: 36px;
      height: 72px;
      background: #0ea5e9;
      border: none;
      border-radius: 10px 0 0 10px;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: -4px 0 16px rgba(0,0,0,0.4);
    }
    #term-toggle:hover { background: #0284c7; }

    /* Overlay toggle */
    #overlay-toggle {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 25;
      background: rgba(14, 165, 233, 0.9);
      border: none;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    #overlay-toggle.active { background: #f472b6; }

    #stats {
      position: absolute;
      left: 12px;
      top: 56px;
      z-index: 25;
      font-family: monospace;
      font-size: 0.7rem;
      color: #7dd3fc;
      background: rgba(0,0,0,0.45);
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* Math terminal — slides up from bottom */
    #terminal {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      max-height: 55vh;
      background: rgba(12, 12, 18, 0.97);
      border-top: 1px solid #2a2a3a;
      border-radius: 16px 16px 0 0;
      transform: translateY(100%);
      transition: transform 0.28s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    }
    #terminal.open { transform: translateY(0); }

    #term-handle {
      flex-shrink: 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      color: #555;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      user-select: none;
    }
    #term-handle::before {
      content: '';
      width: 40px;
      height: 4px;
      background: #444;
      border-radius: 2px;
      margin-right: 10px;
    }

    #term-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 20px;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #e2e8f0;
    }
    label {
      display: block;
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      margin-top: 12px;
    }
    .value {
      float: right;
      color: #7dd3fc;
      font-family: monospace;
      font-size: 0.75rem;
      text-transform: none;
      letter-spacing: 0;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }
    input[type="text"] {
      width: 100%;
      background: #1a1a24;
      border: 1px solid #333;
      border-radius: 8px;
      color: #7dd3fc;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 10px 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #38bdf8; }

    .row { display: flex; gap: 8px; margin-top: 10px; }
    button.act {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    button.act:hover { background: #334155; }
    button.act.primary {
      background: #0ea5e9;
      border-color: #0284c7;
      color: #fff;
      font-weight: 500;
    }
    button.act.primary:hover { background: #0284c7; }
    button.act.danger {
      background: #3f1d2e;
      border-color: #9d174d;
      color: #f9a8d4;
    }

    .hint {
      font-size: 0.65rem;
      color: #555;
      margin-top: 6px;
      line-height: 1.4;
    }
    .section {
      border-top: 1px solid #222230;
      margin-top: 14px;
      padding-top: 4px;
    }
    code { color: #a5b4fc; font-size: 0.7rem; }

    /* Particle number overlay labels (HTML layer) */
    #number-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      display: none;
      overflow: hidden;
    }
    #number-overlay.show { display: block; }
    .pnum {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: monospace;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(14, 165, 233, 0.35);
      border: 1px solid rgba(125, 211, 252, 0.4);
      border-radius: 4px;
      padding: 1px 3px;
      white-space: nowrap;
      pointer-events: none;
    }
    .pnum.selected {
      background: rgba(244, 114, 182, 0.55);
      border-color: #f9a8d4;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="number-overlay"></div>

  <button id="overlay-toggle">Show particle #s</button>
  <div id="stats">particles: —</div>
  <button id="term-toggle" title="Math terminal">☰</button>

  <div id="terminal">
    <div id="term-handle">MATH</div>
    <div id="term-body">
      <h2>MathClay terminal</h2>
      <p class="hint">Move = angles + distance only. No direction buttons.</p>

      <div class="section">
        <label>Select particles</label>
        <input type="text" id="selectInput" placeholder="e.g. 0, 5, 12-20  or click the clay" />
        <p class="hint">Type IDs (comma or ranges) · or click the block to select nearby particles</p>
        <div class="row">
          <button class="act" id="btnSelect">Select</button>
          <button class="act danger" id="btnClearSel">Clear selection</button>
        </div>
        <p class="hint" id="selInfo">selected: 0</p>
      </div>

      <div class="section">
        <label>Azimuth angle ° <span class="value" id="az-val">0</span></label>
        <input type="range" id="azimuth" min="0" max="360" value="0" step="1" />

        <label>Elevation angle ° <span class="value" id="el-val">0</span></label>
        <input type="range" id="elevation" min="-90" max="90" value="0" step="1" />

        <label>Distance (0–1000) <span class="value" id="dist-val">50</span></label>
        <input type="range" id="distance" min="0" max="1000" value="50" step="1" />

        <p class="hint">
          Math: <code>pos += directionFrom(azimuth, elevation) × (distance / 500)</code>
        </p>

        <div class="row">
          <button class="act primary" id="btnApply">Apply math to selection</button>
        </div>
      </div>

      <div class="section">
        <label>Brush size (for click-select) <span class="value" id="brush-val">0.30</span></label>
        <input type="range" id="brush" min="0.05" max="1.0" value="0.30" step="0.05" />

        <div class="row" style="margin-top:12px">
          <button class="act" id="btnReset">Reset solid block</button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ═══════════════════════════════════════════════════════════
    // MathClay — angles + distance only
    // Select by number or click · particle # overlay
    // ═══════════════════════════════════════════════════════════

    const container = document.getElementById('canvas-container');
    const overlayEl = document.getElementById('number-overlay');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07070a);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(3.0, 2.4, 3.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const key = new THREE.DirectionalLight(0xfff5e6, 1.1);
    key.position.set(4, 7, 3);
    scene.add(key);
    scene.add(new THREE.DirectionalLight(0xa5b4fc, 0.35).translateX(-3).translateY(2).translateZ(-4));

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x0c0c12, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.35;
    scene.add(ground);

    // ── Solid particle block ───────────────────────────────────
    let particles = []; // {id, x,y,z, r,g,b}
    let selected = new Set();
    let pointsObj = null;
    let pointsGeo = null;
    let showNumbers = false;
    let brushRadius = 0.30;
    const claySize = 2.0;

    // Math params — angles + distance only
    let azimuth = 0;    // degrees 0-360
    let elevation = 0;  // degrees -90..90
    let distance = 50;  // 0-1000

    function createSolidBlock(density = 16) {
      particles = [];
      selected.clear();
      const n = density;
      const half = claySize * 0.5;
      const step = claySize / (n - 1 || 1);
      let id = 0;
      for (let iz = 0; iz < n; iz++) {
        for (let iy = 0; iy < n; iy++) {
          for (let ix = 0; ix < n; ix++) {
            particles.push({
              id: id++,
              x: -half + ix * step,
              y: -half + iy * step,
              z: -half + iz * step,
              r: 0.74 + Math.random() * 0.06,
              g: 0.58 + Math.random() * 0.05,
              b: 0.42 + Math.random() * 0.04
            });
          }
        }
      }
      rebuildPoints();
      updateSelInfo();
      document.getElementById('stats').textContent =
        `particles: ${particles.length.toLocaleString()}`;
      if (showNumbers) rebuildNumberOverlay();
    }

    function rebuildPoints() {
      if (pointsObj) {
        scene.remove(pointsObj);
        pointsGeo?.dispose();
        pointsObj.material?.dispose();
      }
      const count = particles.length;
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const p = particles[i];
        pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
        if (selected.has(p.id)) {
          col[i*3] = 0.95; col[i*3+1] = 0.45; col[i*3+2] = 0.75; // selected = pink
        } else {
          col[i*3] = p.r; col[i*3+1] = p.g; col[i*3+2] = p.b;
        }
      }
      pointsGeo = new THREE.BufferGeometry();
      pointsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      pointsGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.07,
        vertexColors: true,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.95
      });
      pointsObj = new THREE.Points(pointsGeo, mat);
      scene.add(pointsObj);
    }

    function syncPositionsAndColors() {
      if (!pointsGeo) return;
      const pos = pointsGeo.attributes.position.array;
      const col = pointsGeo.attributes.color.array;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
        if (selected.has(p.id)) {
          col[i*3] = 0.95; col[i*3+1] = 0.45; col[i*3+2] = 0.75;
        } else {
          col[i*3] = p.r; col[i*3+1] = p.g; col[i*3+2] = p.b;
        }
      }
      pointsGeo.attributes.position.needsUpdate = true;
      pointsGeo.attributes.color.needsUpdate = true;
    }

    // Direction from angles only (no fixed Up/Left buttons)
    function directionFromAngles(azDeg, elDeg) {
      const az = azDeg * Math.PI / 180;
      const el = elDeg * Math.PI / 180;
      // spherical → cartesian
      const x = Math.cos(el) * Math.sin(az);
      const y = Math.sin(el);
      const z = Math.cos(el) * Math.cos(az);
      return { x, y, z };
    }

    // Apply: pos += dir(angles) × (distance/500)
    // distance UI is 0–1000; scale keeps motion usable in scene units
    function applyMathToSelection() {
      if (selected.size === 0) {
        updateSelInfo('nothing selected');
        return;
      }
      const dir = directionFromAngles(azimuth, elevation);
      const scale = distance / 500; // 0–1000 → 0–2 world units

      for (const p of particles) {
        if (!selected.has(p.id)) continue;
        p.x += dir.x * scale;
        p.y += dir.y * scale;
        p.z += dir.z * scale;
      }
      syncPositionsAndColors();
      if (showNumbers) rebuildNumberOverlay();
    }

    // ── Selection by typed numbers ─────────────────────────────
    function parseSelection(text) {
      const ids = new Set();
      const parts = text.split(/[,\s]+/).filter(Boolean);
      for (const part of parts) {
        if (part.includes('-')) {
          const [a, b] = part.split('-').map(s => parseInt(s.trim(), 10));
          if (!Number.isNaN(a) && !Number.isNaN(b)) {
            const lo = Math.min(a, b), hi = Math.max(a, b);
            for (let i = lo; i <= hi; i++) ids.add(i);
          }
        } else {
          const n = parseInt(part, 10);
          if (!Number.isNaN(n)) ids.add(n);
        }
      }
      return ids;
    }

    function selectFromInput() {
      const text = document.getElementById('selectInput').value;
      const ids = parseSelection(text);
      selected = new Set([...ids].filter(id => id >= 0 && id < particles.length));
      syncPositionsAndColors();
      updateSelInfo();
      if (showNumbers) rebuildNumberOverlay();
    }

    function clearSelection() {
      selected.clear();
      document.getElementById('selectInput').value = '';
      syncPositionsAndColors();
      updateSelInfo();
      if (showNumbers) rebuildNumberOverlay();
    }

    function updateSelInfo(extra) {
      const el = document.getElementById('selInfo');
      el.textContent = extra || `selected: ${selected.size}`;
    }

    // ── Click to select group near tap ─────────────────────────
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function pickNearRay(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const origin = raycaster.ray.origin;
      const dir = raycaster.ray.direction;

      let bestDist = Infinity;
      let bestP = null;
      for (const p of particles) {
        const ox = p.x - origin.x, oy = p.y - origin.y, oz = p.z - origin.z;
        const t = ox*dir.x + oy*dir.y + oz*dir.z;
        if (t < 0) continue;
        const cx = origin.x + dir.x * t;
        const cy = origin.y + dir.y * t;
        const cz = origin.z + dir.z * t;
        const d2 = (p.x-cx)**2 + (p.y-cy)**2 + (p.z-cz)**2;
        if (d2 < bestDist) {
          bestDist = d2;
          bestP = p;
        }
      }
      if (!bestP || bestDist > brushRadius * brushRadius * 9) return null;
      return bestP;
    }

    function selectGroupAt(clientX, clientY) {
      const center = pickNearRay(clientX, clientY);
      if (!center) return;
      const r2 = brushRadius * brushRadius;
      for (const p of particles) {
        const dx = p.x - center.x, dy = p.y - center.y, dz = p.z - center.z;
        if (dx*dx + dy*dy + dz*dz <= r2) selected.add(p.id);
      }
      // Reflect in text field
      const sorted = [...selected].sort((a,b) => a-b);
      document.getElementById('selectInput').value = sorted.join(', ');
      syncPositionsAndColors();
      updateSelInfo();
      if (showNumbers) rebuildNumberOverlay();
    }

    // ── Number overlay ─────────────────────────────────────────
    function rebuildNumberOverlay() {
      overlayEl.innerHTML = '';
      if (!showNumbers) return;

      // Limit labels for performance — show all if few, else subsample
      const maxLabels = 800;
      const step = particles.length > maxLabels
        ? Math.ceil(particles.length / maxLabels)
        : 1;

      for (let i = 0; i < particles.length; i += step) {
        const p = particles[i];
        const v = new THREE.Vector3(p.x, p.y, p.z);
        v.project(camera);
        if (v.z > 1) continue; // behind camera
        const x = (v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
        if (x < -20 || x > window.innerWidth + 20 || y < -20 || y > window.innerHeight + 20) continue;

        const span = document.createElement('div');
        span.className = 'pnum' + (selected.has(p.id) ? ' selected' : '');
        span.textContent = p.id;
        span.style.left = x + 'px';
        span.style.top = y + 'px';
        overlayEl.appendChild(span);
      }
    }

    // ── Input: click = select (when not orbiting) ──────────────
    let pointerDown = false;
    let downX = 0, downY = 0;
    let moved = false;

    renderer.domElement.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      pointerDown = true;
      moved = false;
      downX = e.clientX;
      downY = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (!pointerDown) return;
      if (Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) moved = true;
    });
    window.addEventListener('pointerup', e => {
      if (!pointerDown) return;
      pointerDown = false;
      // Tap without drag → select particles at that spot
      if (!moved && e.button === 0) {
        // Don't select if terminal is open and click was on terminal
        const term = document.getElementById('terminal');
        if (term.classList.contains('open')) {
          const rect = term.getBoundingClientRect();
          if (e.clientY >= rect.top) return;
        }
        selectGroupAt(e.clientX, e.clientY);
      }
    });

    // ── Terminal open / close ──────────────────────────────────
    const terminal = document.getElementById('terminal');
    const termToggle = document.getElementById('term-toggle');
    termToggle.addEventListener('click', () => {
      terminal.classList.toggle('open');
      termToggle.textContent = terminal.classList.contains('open') ? '✕' : '☰';
    });

    // Simple drag handle to close
    document.getElementById('term-handle').addEventListener('click', () => {
      // optional: could drag — for now click handle also toggles
    });

    // Overlay toggle
    const overlayBtn = document.getElementById('overlay-toggle');
    overlayBtn.addEventListener('click', () => {
      showNumbers = !showNumbers;
      overlayBtn.classList.toggle('active', showNumbers);
      overlayBtn.textContent = showNumbers ? 'Hide particle #s' : 'Show particle #s';
      overlayEl.classList.toggle('show', showNumbers);
      if (showNumbers) rebuildNumberOverlay();
      else overlayEl.innerHTML = '';
    });

    // Terminal controls
    document.getElementById('azimuth').addEventListener('input', e => {
      azimuth = +e.target.value;
      document.getElementById('az-val').textContent = azimuth;
    });
    document.getElementById('elevation').addEventListener('input', e => {
      elevation = +e.target.value;
      document.getElementById('el-val').textContent = elevation;
    });
    document.getElementById('distance').addEventListener('input', e => {
      distance = +e.target.value;
      document.getElementById('dist-val').textContent = distance;
    });
    document.getElementById('brush').addEventListener('input', e => {
      brushRadius = +e.target.value;
      document.getElementById('brush-val').textContent = brushRadius.toFixed(2);
    });

    document.getElementById('btnSelect').addEventListener('click', selectFromInput);
    document.getElementById('btnClearSel').addEventListener('click', clearSelection);
    document.getElementById('btnApply').addEventListener('click', applyMathToSelection);
    document.getElementById('btnReset').addEventListener('click', () => createSolidBlock(16));

    document.getElementById('selectInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') selectFromInput();
    });

    // ── Loop ───────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      if (showNumbers) rebuildNumberOverlay();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (showNumbers) rebuildNumberOverlay();
    });

    createSolidBlock(16);
  </script>
</body>
</html>

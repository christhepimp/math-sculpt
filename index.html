<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathClay Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #08080c;
      color: #e8e8ec;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-container { position: absolute; inset: 0; }
    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 320px;
      background: rgba(10, 10, 16, 0.94);
      border: 1px solid #2a2a38;
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      z-index: 10;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin-bottom: 2px;
    }
    .tagline {
      font-size: 0.72rem;
      color: #777;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.68rem;
      color: #999;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1;
      background: #1a1a26;
      border: 1px solid #333344;
      color: #e2e8f0;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { background: #2a2a3a; }
    button.primary {
      background: #0ea5e9;
      border-color: #0284c7;
      color: #fff;
      font-weight: 500;
    }
    button.primary:hover { background: #0284c7; }
    button.active {
      background: #0ea5e9;
      border-color: #0284c7;
      color: #fff;
    }
    .slider-group { margin-top: 12px; }
    input[type="range"] {
      width: 100%;
      margin-top: 3px;
      accent-color: #38bdf8;
    }
    .value {
      float: right;
      color: #7dd3fc;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .info {
      font-size: 0.7rem;
      color: #666;
      margin-top: 12px;
      line-height: 1.45;
    }
    .stat {
      font-family: monospace;
      font-size: 0.72rem;
      color: #7dd3fc;
      margin-bottom: 10px;
    }
    .section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #222230;
    }
    .dirs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-top: 6px;
    }
    .dirs button { font-size: 0.7rem; padding: 7px 4px; }
    .hint {
      font-size: 0.65rem;
      color: #555;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <h1>MathClay</h1>
    <p class="tagline">Mathematical digital clay · no meshes</p>

    <div class="stat" id="stats">particles: —</div>

    <!-- Brush -->
    <label>Brush radius <span class="value" id="radius-val">0.35</span></label>
    <input type="range" id="radius" min="0.05" max="1.5" value="0.35" step="0.05" />

    <div class="slider-group">
      <label>Push distance <span class="value" id="dist-val">0.08</span></label>
      <input type="range" id="distance" min="0.01" max="0.4" value="0.08" step="0.01" />
    </div>

    <div class="section">
      <label>Direction</label>
      <div class="dirs">
        <button data-d="0,1,0" class="active">Up</button>
        <button data-d="0,-1,0">Down</button>
        <button data-d="1,0,0">Right</button>
        <button data-d="-1,0,0">Left</button>
        <button data-d="0,0,1">Forward</button>
        <button data-d="0,0,-1">Back</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="dir-out" class="active">Out (from center)</button>
        <button id="dir-in">In (to center)</button>
      </div>
    </div>

    <div class="section">
      <label>Particle density <span class="value" id="dens-val">24</span></label>
      <input type="range" id="density" min="8" max="48" value="24" step="2" />
      <p class="hint">Higher = more particles = more detail (slower)</p>
    </div>

    <div class="section">
      <label>Color</label>
      <div class="row">
        <input type="color" id="paintColor" value="#c4a484" style="flex:1;height:34px;border:none;border-radius:6px;background:#1a1a26;cursor:pointer" />
        <button id="paintMode">Paint</button>
      </div>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="primary" id="reset">Reset Clay</button>
    </div>

    <p class="info">
      <strong>How to sculpt</strong><br>
      Click + drag on the clay.<br>
      Selected particles move by:<br>
      <code style="color:#a5b4fc">position + direction × distance</code><br><br>
      That is the entire sculpt operation.
    </p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ═══════════════════════════════════════════════════════════
    // MathClay Engine
    // Pure particle clay. No meshes. No topology.
    // Sculpt = select particles + direction × distance
    // ═══════════════════════════════════════════════════════════

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08080c);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(3.2, 2.6, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;

    // Soft lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const key = new THREE.DirectionalLight(0xfff5e6, 1.1);
    key.position.set(4, 7, 3);
    scene.add(key);
    scene.add(new THREE.DirectionalLight(0xa5b4fc, 0.35).translateX(-3).translateY(2).translateZ(-4));

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x101014, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.4;
    scene.add(ground);

    // ── Particle Clay ──────────────────────────────────────────
    // Each particle: id, x, y, z, r, g, b
    // Packed densely → forms solid clay

    let positions;   // Float32Array xyz
    let colors;      // Float32Array rgb
    let particleCount = 0;
    let points;      // THREE.Points for rendering
    let geometry;

    const clayCenter = new THREE.Vector3(0, 0, 0);
    let claySize = 2.0;

    function createClay(density = 24) {
      // density = particles per axis → total ≈ density³
      const n = density;
      particleCount = n * n * n;

      positions = new Float32Array(particleCount * 3);
      colors    = new Float32Array(particleCount * 3);

      const half = claySize * 0.5;
      const step = claySize / (n - 1 || 1);
      let idx = 0;

      for (let iz = 0; iz < n; iz++) {
        for (let iy = 0; iy < n; iy++) {
          for (let ix = 0; ix < n; ix++) {
            const i3 = idx * 3;
            positions[i3]     = -half + ix * step;
            positions[i3 + 1] = -half + iy * step;
            positions[i3 + 2] = -half + iz * step;

            // Default warm clay color with slight variation
            colors[i3]     = 0.72 + (Math.random() * 0.08);
            colors[i3 + 1] = 0.58 + (Math.random() * 0.06);
            colors[i3 + 2] = 0.42 + (Math.random() * 0.05);
            idx++;
          }
        }
      }

      if (points) {
        scene.remove(points);
        geometry.dispose();
        points.material.dispose();
      }

      geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.055,
        vertexColors: true,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.95,
        depthWrite: true
      });

      points = new THREE.Points(geometry, material);
      scene.add(points);

      document.getElementById('stats').textContent =
        `particles: ${particleCount.toLocaleString()}`;
    }

    createClay(24);

    // ── Core sculpt operation ──────────────────────────────────
    // New Position = Current Position + Direction × Distance
    // Only particles inside the brush radius are moved.

    let brushRadius = 0.35;
    let pushDistance = 0.08;
    let directionMode = 'out'; // 'out' | 'in' | 'fixed'
    let fixedDir = new THREE.Vector3(0, 1, 0);
    let isPainting = false;
    let paintColor = new THREE.Color('#c4a484');

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isSculpting = false;

    // Find particles near a 3D point and move / paint them
    function applyBrush(worldPoint) {
      const r2 = brushRadius * brushRadius;
      const posAttr = geometry.attributes.position;
      const colAttr = geometry.attributes.color;
      const arr = posAttr.array;
      const carr = colAttr.array;

      let moved = 0;

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const px = arr[i3];
        const py = arr[i3 + 1];
        const pz = arr[i3 + 2];

        const dx = px - worldPoint.x;
        const dy = py - worldPoint.y;
        const dz = pz - worldPoint.z;
        const dist2 = dx*dx + dy*dy + dz*dz;

        if (dist2 > r2) continue;

        // Falloff: stronger at center of brush
        const dist = Math.sqrt(dist2);
        const falloff = 1 - (dist / brushRadius);
        const strength = falloff * falloff; // smooth

        if (isPainting) {
          // Color is also just numbers on the particle
          carr[i3]     = paintColor.r;
          carr[i3 + 1] = paintColor.g;
          carr[i3 + 2] = paintColor.b;
        } else {
          // ── The only sculpt math ──
          // NewPos = CurrentPos + Direction × Distance
          let dirX, dirY, dirZ;

          if (directionMode === 'out') {
            // Away from clay center
            dirX = px - clayCenter.x;
            dirY = py - clayCenter.y;
            dirZ = pz - clayCenter.z;
            const len = Math.sqrt(dirX*dirX + dirY*dirY + dirZ*dirZ) || 1;
            dirX /= len; dirY /= len; dirZ /= len;
          } else if (directionMode === 'in') {
            dirX = clayCenter.x - px;
            dirY = clayCenter.y - py;
            dirZ = clayCenter.z - pz;
            const len = Math.sqrt(dirX*dirX + dirY*dirY + dirZ*dirZ) || 1;
            dirX /= len; dirY /= len; dirZ /= len;
          } else {
            dirX = fixedDir.x;
            dirY = fixedDir.y;
            dirZ = fixedDir.z;
          }

          const d = pushDistance * strength;
          arr[i3]     += dirX * d;
          arr[i3 + 1] += dirY * d;
          arr[i3 + 2] += dirZ * d;
        }
        moved++;
      }

      if (moved > 0) {
        posAttr.needsUpdate = true;
        colAttr.needsUpdate = true;
      }
    }

    // Project mouse onto a virtual plane / find nearby particles
    function getBrushPoint(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // Simple approach: find the closest particle to the ray
      // and use its position as the brush center
      const arr = geometry.attributes.position.array;
      let bestDist = Infinity;
      let best = null;

      const origin = raycaster.ray.origin;
      const dir = raycaster.ray.direction;

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const px = arr[i3], py = arr[i3+1], pz = arr[i3+2];

        // Distance from point to ray
        const ox = px - origin.x;
        const oy = py - origin.y;
        const oz = pz - origin.z;
        const t = ox*dir.x + oy*dir.y + oz*dir.z;
        if (t < 0) continue;
        const closestX = origin.x + dir.x * t;
        const closestY = origin.y + dir.y * t;
        const closestZ = origin.z + dir.z * t;
        const ddx = px - closestX;
        const ddy = py - closestY;
        const ddz = pz - closestZ;
        const d2 = ddx*ddx + ddy*ddy + ddz*ddz;

        if (d2 < bestDist && d2 < brushRadius * brushRadius * 4) {
          bestDist = d2;
          best = new THREE.Vector3(px, py, pz);
        }
      }
      return best;
    }

    // ── Input ──────────────────────────────────────────────────
    let lastBrushPoint = null;

    function onPointerDown(e) {
      if (e.button !== 0) return;
      // Disable orbit while sculpting
      controls.enabled = false;
      isSculpting = true;
      const pt = getBrushPoint(e.clientX, e.clientY);
      if (pt) {
        applyBrush(pt);
        lastBrushPoint = pt;
      }
    }

    function onPointerMove(e) {
      if (!isSculpting) return;
      const pt = getBrushPoint(e.clientX, e.clientY);
      if (pt) {
        applyBrush(pt);
        lastBrushPoint = pt;
      }
    }

    function onPointerUp() {
      isSculpting = false;
      controls.enabled = true;
      lastBrushPoint = null;
    }

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // ── UI wiring ──────────────────────────────────────────────
    document.getElementById('radius').addEventListener('input', e => {
      brushRadius = +e.target.value;
      document.getElementById('radius-val').textContent = brushRadius.toFixed(2);
    });
    document.getElementById('distance').addEventListener('input', e => {
      pushDistance = +e.target.value;
      document.getElementById('dist-val').textContent = pushDistance.toFixed(2);
    });

    document.querySelectorAll('.dirs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.dirs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('dir-out').classList.remove('active');
        document.getElementById('dir-in').classList.remove('active');
        directionMode = 'fixed';
        const [x,y,z] = btn.dataset.d.split(',').map(Number);
        fixedDir.set(x, y, z);
      });
    });

    document.getElementById('dir-out').addEventListener('click', () => {
      directionMode = 'out';
      document.getElementById('dir-out').classList.add('active');
      document.getElementById('dir-in').classList.remove('active');
      document.querySelectorAll('.dirs button').forEach(b => b.classList.remove('active'));
    });
    document.getElementById('dir-in').addEventListener('click', () => {
      directionMode = 'in';
      document.getElementById('dir-in').classList.add('active');
      document.getElementById('dir-out').classList.remove('active');
      document.querySelectorAll('.dirs button').forEach(b => b.classList.remove('active'));
    });

    document.getElementById('density').addEventListener('input', e => {
      document.getElementById('dens-val').textContent = e.target.value;
    });
    document.getElementById('density').addEventListener('change', e => {
      createClay(+e.target.value);
    });

    document.getElementById('paintColor').addEventListener('input', e => {
      paintColor.set(e.target.value);
    });

    const paintBtn = document.getElementById('paintMode');
    paintBtn.addEventListener('click', () => {
      isPainting = !isPainting;
      paintBtn.classList.toggle('active', isPainting);
      paintBtn.textContent = isPainting ? 'Painting…' : 'Paint';
    });

    document.getElementById('reset').addEventListener('click', () => {
      createClay(+document.getElementById('density').value);
    });

    // ── Loop ───────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
